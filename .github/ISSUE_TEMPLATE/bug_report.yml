name: Bug report
about: Report a failure of the diagnostic or patch helper
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include cookies, tokens, proxy credentials, private URLs, or account identifiers.
  - type: input
    id: codex_version
    attributes:
      label: Codex Desktop version
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: Include the exact error string, for example `nodeRepl.fetch request failed`.
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Sanitized diagnostic result
      description: State whether direct failed and proxied connectivity succeeded. Do not paste secrets.
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
